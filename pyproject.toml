[project]
name = "agtuned-vlm"
version = "0.1.0"
description = "VLM evaluation pipeline for agricultural image understanding"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Inference engine (Linux only — CPU fallback on macOS for development)
    "vllm==0.20.1; sys_platform == 'linux'",
    # Model loading & vision backbones
    "transformers>=5.5.0",
    "accelerate>=0.34.0",
    "bitsandbytes>=0.43.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pillow>=10.0.0",
    "sentencepiece>=0.2.1",
    "ultralytics>=8.0.0",
    "open_clip_torch>=2.24.0",
    # AgML datasets
    "agml>=0.7.4",
    # Metrics & evaluation
    "scikit-learn>=1.3.0",
    "numpy>=1.26.0",
    "nltk>=3.8",
    "rouge-score>=0.1.2",
    "evaluate>=0.4.0",
    # HuggingFace ecosystem
    "datasets>=3.0.0",
    "huggingface-hub>=0.23.0",
    "pyarrow>=15.0.0",
    "sentence-transformers>=3.0.0",
    # Reference DB (build_reference_db.py)
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "requests>=2.31",
    # LLM-as-a-Verifier (PPT tournament + logprob reward extraction)
    "llm-verifier>=0.1.0",
    # LoRA fine-tuning (lora_setup/, ag_finetune/training/) — Linux/CUDA only,
    # same as vllm above. Pinned to GitHub main via [tool.uv.sources] below —
    # PyPI's unsloth/unsloth-zoo releases lagged their own fix for a
    # transformers>=5.x import crash (NameError: 'auto_docstring' is not
    # defined, from _utils.py's exec() of config source without that
    # decorator in scope) that we hit on the farm even after `uv lock
    # --upgrade-package unsloth --upgrade-package unsloth_zoo`.
    "unsloth; sys_platform == 'linux'",
    "unsloth-zoo; sys_platform == 'linux'",
    "trl>=0.12.0; sys_platform == 'linux'",
    # Training loss/metrics dashboard (report_to="trackio" in the fine-tuning
    # scripts above) — local-first, no account needed, cross-platform
    "trackio>=0.1.0",
    # Config, plotting, UI
    "pyyaml>=6.0",
    "matplotlib>=3.8.0",
    "streamlit>=1.35",
    "plotly>=5.18.0",
    "tqdm>=4.66",
    "ddgs>=9.14.4",
    "trafilatura>=2.2.0",
    # ReAct baseline (src/baselines/) — agml-agent's grounding/catalog-search
    # tools, imported directly as a Python package rather than over MCP (no
    # client/server round trip needed for a batch eval harness — see
    # src/baselines/tools.py). The agent itself runs on the same local vLLM
    # models as every other script here (src/common/vlm_load.py), no
    # separate hosted-API dependency needed.
    "agml-agent",
]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]
# unsloth-zoo's transformers upper bound (<=5.5.0) doesn't overlap with
# vllm==0.20.1's requirement (transformers>=4.56.0,<5.0.dev0 OR >5.5.0) —
# the only overlap between them is entirely in the old 4.x line, which is
# too old for Qwen3.5's model architecture. That looks like a stale/
# conservative pin on unsloth-zoo's side rather than a real incompatibility,
# so override it rather than downgrade transformers and lose Qwen3.5 support.
override-dependencies = [
    "transformers>=5.5.0",
]

[tool.uv.sources]
unsloth = { git = "https://github.com/unslothai/unsloth.git" }
unsloth-zoo = { git = "https://github.com/unslothai/unsloth-zoo.git" }
agml-agent = { git = "https://github.com/Project-AgML/agml-agent" }
