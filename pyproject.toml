[project]
name = "agtuned-vlm"
version = "0.1.0"
description = "VLM evaluation pipeline for agricultural image understanding"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Inference engine (Linux only — CPU fallback on macOS for development)
    "vllm==0.20.1; sys_platform == 'linux'",

    # Model loading & vision backbones
    "transformers>=5.5.0",
    "accelerate>=0.34.0",
    "bitsandbytes>=0.43.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pillow>=10.0.0",
    "sentencepiece>=0.2.1",
    "ultralytics>=8.0.0",
    "open_clip_torch>=2.24.0",

    # AgML datasets
    "agml>=0.7.4",

    # Metrics & evaluation
    "scikit-learn>=1.3.0",
    "numpy>=1.26.0",
    "nltk>=3.8",
    "rouge-score>=0.1.2",
    "evaluate>=0.4.0",

    # HuggingFace ecosystem
    "datasets>=3.0.0",
    "huggingface-hub>=0.23.0",
    "pyarrow>=15.0.0",
    "sentence-transformers>=3.0.0",

    # Reference DB (build_reference_db.py)
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "requests>=2.31",

    # Config, plotting, UI
    "pyyaml>=6.0",
    "matplotlib>=3.8.0",
    "streamlit>=1.35",
    "plotly>=5.18.0",
    "tqdm>=4.66",
]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]
