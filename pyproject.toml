[project]
name = "agtuned-vlm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "agml>=0.7.4",
    "bitsandbytes>=0.45.0",
    "datasets>=3.0.0",
    "debugpy>=1.8.20",
    "hf-transfer>=0.1.9",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "nvidia-cudnn-cu13; sys_platform == 'linux'",
    "nvidia-cusparselt-cu13==0.8.0; sys_platform == 'linux'",
    "nvidia-nccl-cu13; sys_platform == 'linux'",
    "nvidia-nvshmem-cu13; sys_platform == 'linux'",
    "peft>=0.10.0",
    "pillow>=10.0.0",
    "protobuf>=3.20.0",
    "scikit-learn>=1.3.0",
    "ultralytics>=8.0.0",
    "sentencepiece>=0.2.1",
    "timm>=1.0.26",
    "torch>=2.2.0",
    "torchao>=0.17.0",
    "torchcodec>=0.11.1; sys_platform == 'linux'",
    "torchvision>=0.17.0",
    "trackio>=0.25.1",
    "transformers>=5.5.0",
    "triton>=3.6.0; sys_platform == 'linux'",
    "trl>=0.24.0",
    "unsloth>=2026.4.8; sys_platform == 'linux'",
    "unsloth-zoo>=2026.4.9; sys_platform == 'linux'",
    "xformers>=0.0.25; sys_platform == 'linux'",
]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]
