# Chain-of-thought visual analysis prompts for agricultural classification.
#
# Pipeline per image:
#   Stage 1..N : [image] + step[i] → structured observation (one turn per step)
#   Final turn : [image] + full history + classification_question → class label
#
# The final classification question comes from prompts.yaml (same as vision baseline).
# Task type → CoT path routing is in task_type_to_cot below.

# ── CoT step prompts (keyed by task group) ────────────────────────────────────

thinking_prompts:

  disease_pest:
    steps:
      - "What specific plant or crop species is this (Scientific Name and Common Name)?"
      - "Which specific parts of the plant are showing symptoms (e.g., upper leaves, lower leaves, stems, veins, flowers, fruit)?"
      - "Describe the exact nature of the damage — color (e.g., yellow, brown, black), shape (e.g., circular spots, irregular blotches, necrotic margins), and texture (e.g., powdery, water-soaked, fuzzy) of the affected areas."
      - "Are there any visible signs of insects or mites, such as webbing, tiny eggs, frass, or actual bodies?"
      - "Is the damage uniform across the whole plant (suggesting environmental or nutrient stress), or isolated and random (suggesting a pest or pathogen)?"
      - "Based on the visual markers so far, what is the most likely disease, pest, or stress/damage? State your confidence for each."

  weed_identification:
    steps:
      - "Describe the leaf arrangement (opposite, alternate, whorled), shape (lanceolate, ovate, lobed), margins (smooth, serrated, toothed), and venation pattern (parallel, palmate, pinnate)."
      - "Is the plant erect, prostrate/creeping, or a climbing vine? Are there visible hairs, thorns, or distinct colors on the stem?"
      - "If visible, describe any flowers, seed pods, cones, or buds — noting color, petal count, and arrangement."
      - "Based on the visual markers so far, what is the most likely botanical matches (Scientific Name and Common Name)? State your confidence for each."

# ── Task type routing ─────────────────────────────────────────────────────────

# Maps dataset task_type → thinking_prompt key above
task_type_to_cot:
  disease:             disease_pest
  pest_damage:         disease_pest
  weed_identification: weed_identification
