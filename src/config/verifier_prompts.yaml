# Verifier prompt templates for Stage 4 (verifier-cot) — round-based belief
# tracking, see docs/verifier_score_belief_update.md. Three prompts live here:
#
# - score_prompt — used exclusively by --baseline argmax (the basic-PPT-score
#   ablation: every candidate scored independently, no reference, no
#   pairwise call, no belief object — isolates what the pairwise/belief
#   machinery buys over naive repeated absolute-scoring).
# - same_answer_prompt — used exclusively by --baseline belief, and only for
#   the persistent-belief carry-forward decision (NOT for ranking the pool —
#   that's still the PPT tournament). When a NEW candidate outranks the
#   incumbent's own pool slot, this asks whether its extracted <answer> tag
#   is the SAME underlying class/diagnosis as the incumbent's, allowing for
#   wording/synonym/detail differences — a "same answer, reworded" verdict
#   carries the persistent belief forward instead of resetting it. Text-only
#   (just the two short extracted answers, no image, no full trajectory) —
#   deliberately open-ended, no closed-set class vocabulary, since real-world
#   answers aren't a fixed label set (docs/verifier_score_belief_update.md's
#   class-identity note).
# - pairwise_prompt — used by --baseline belief's PPT tournament duels
#   (ranking the pool) AND by src/verifier_lmv.py's own PPT baseline — the
#   dual-trajectory scoring template (arXiv:2607.05391 Section 3.2:
#   <score_A>/<score_B> tags, two-pass teacher-forced/prefill logprob
#   extraction via src/common/ppt_scoring.py). Originally a fixed Python
#   template (not meant to be edited, a "citable reproduction of the
#   paper's prompt") — moved here after a real run showed the paper's own
#   template needed two fixes: (1) it embedded the literal <score_A>/
#   <score_B> tags right after the "analyze, then score" instruction,
#   which caused the model to skip analysis almost entirely (99.6% empty
#   analysis on a 20k-pair sample) rather than write free text first — the
#   tags are no longer shown here at all, they're only ever supplied by
#   pass 2's forced continuation (src/common/ppt_scoring.py::
#   build_score_prompt), never sampled freely; (2) the rating rule was
#   lenient enough that 80.6% of a real sample scored BOTH trajectories
#   above 0.9 — added an explicit anti-tie instruction. So this is now OUR
#   adapted version of the paper's template, not a verbatim reproduction —
#   which is exactly why it belongs here (edit-without-redeploy, and a
#   single citable record for the paper) rather than staying hardcoded.
#   Params: {rubric} {question} {trajectory_a} {trajectory_b}
# - question_rephrase_prompt — --rephrase only (src/verifier_cot.py's
#   --baseline belief). Text-only (no image) call, made ONCE per (dataset,
#   class) group before round 1 — not per round, not per image, since the
#   classification question is the same for every image/round in a group —
#   producing rephrase_count alternate wordings of that SAME question
#   (task-specific diagnostic content unchanged, e.g. "What disease... is
#   exhibited in this image of a arabica coffee?"; only surface phrasing
#   varies) via one generate() call sampled rephrase_count times at
#   --rephrase_temperature. Those rephrasings are then reused for every
#   round's rephrase candidates for the rest of that group's run. This is
#   deliberate: rephrasing the QUESTION (not asking the model to
#   "reconsider" its own answer given the identical prompt) targets a
#   different diversity source — a real run found ~36% of image-rounds
#   collapsed onto only 1-2 distinct answers among K=8 candidates at
#   temperature=1.0, i.e. the model anchors hard on a specific literal
#   prompt; varying the prompt itself is more reliable than asking the
#   same model, given the same exact prompt, to introspect on alternatives
#   (which tends to produce shallow hedging rather than genuinely
#   different reasoning). Params: {question} only.
#
# Rubrics are diagnostic reference material shown to the VERIFIER only —
# never to the model being tested — derived from cot_prompts.yaml's step
# content, same precedent as src/verifier_vision.py's inline
# _RUBRIC_DISEASE/_RUBRIC_WEED (moved here so they're edit-without-redeploy,
# same convention as cot_prompts.yaml's step chains).

rubrics:
  disease_pest: |
    1. Does it correctly identify the crop or plant species affected?
    2. Does it match the pattern of affected plant parts visible (leaves, stem, fruit, roots)?
    3. Does it align with the visible symptom characteristics — color, shape, and texture of damage?
    4. If pest-related, does it account for visible pest signs (webbing, frass, eggs, insect bodies)?
    5. Does it reflect whether the damage is systemic/uniform or isolated/localized?
    6. Is the stated condition (disease name, pest, or stress type) visually consistent with the image?
  species_identification: &species_identification_rubric |
    1. Does it match the visible leaf arrangement, shape, margins, and venation pattern?
    2. Does it align with the plant's growth habit (erect, prostrate, climbing) and stem characteristics?
    3. If flowers or seed structures are visible, does the prediction account for them?
    4. Is the botanical identification (Scientific Name and/or Common Name) consistent with all visible features?
  weed_identification: *species_identification_rubric
  quality_identification: |
    1. Does it match the visible size and shape relative to a typical mature specimen?
    2. Does it align with the observed color and its position between unripe and overripe/spoiled?
    3. Does it account for the visible surface texture and firmness cues (bruising, wrinkling, gloss, softness)?
    4. Is the stated quality/ripeness/condition visually consistent with the image?

# Maps dataset task_type (src/config/datasets.yaml) -> rubric key above —
# mirrors cot_prompts.yaml's task_type_to_cot routing.
task_type_to_rubric:
  disease:                 disease_pest
  pest_damage:              disease_pest
  species_identification:  species_identification
  weed_identification:     weed_identification
  quality_identification:  quality_identification

# --baseline argmax ONLY. Independent 1-20 scorer (G=20, matching the PPT
# paper's granularity — see src/verifier_cot.py's SCORE_SCALE_MAX; this is
# a JSON-parsed text score, not logprob-extracted, unlike
# src/verifier_lmv.py's letter-scale prompt). No SUPPORTED/UNSUPPORTED
# verdict field (dropped per explicit request — not useful at this stage)
# — just a score and a short feedback note fed back to the VLM for the
# next round.
# Params: {rubric} {question} {candidate}
score_prompt: |
  You are evaluating a classification prediction for an agricultural image.

  Question asked: "{question}"
  Prediction: "{candidate}"

  Evaluate the prediction against these diagnostic dimensions:
  {rubric}

  Rate correctness on a 1-20 scale based on the diagnostic dimensions above:
  1 = incorrect (clearly wrong or irrelevant to the image)
  10 = borderline (plausible but vague or imprecise)
  20 = correct (precisely correct, specific, and visually grounded)

  Respond with JSON only:
  {{ "score": <int 1-20>, "feedback": "<one sentence on what's missing or worth checking next>" }}

# --baseline belief ONLY. Fired only when this round's tournament top-1 is a
# NEW candidate, not the incumbent's own pool slot — decides whether the
# persistent belief carries forward (same underlying answer, just
# re-derived/reworded) or resets to a fresh prior (a genuine answer
# change). Text-only, no image, no full trajectory — the tournament has
# already judged trajectory quality; this only asks "same conclusion or
# not." No closed-set constraint on either answer string.
# Params: {question} {answer_a} {answer_b}
same_answer_prompt: |
  You are comparing two short answers given to the same agricultural
  classification question, to decide whether they refer to the same
  underlying class, diagnosis, or condition — allowing for different
  wording, synonyms, added or removed detail, or scientific vs. common
  names.

  Question: "{question}"
  Answer A: "{answer_a}"
  Answer B: "{answer_b}"

  Respond with JSON only:
  {{ "same": true or false }}

# --baseline belief's PPT tournament duels AND src/verifier_lmv.py's PPT
# baseline. This is the free-generation (pass 1) prompt only — it
# deliberately does NOT show the <score_A>/<score_B> tags (see the header
# comment above for why); pass 2's forced continuation supplies them
# separately via src/common/ppt_scoring.py::build_score_prompt. Trajectory
# text is truncated to ~500 chars by _truncate_keep_answer before this
# template is filled (never mid-<answer>-tag).
#
# A per-criterion walkthrough version (requiring the analysis to check
# each rubric item individually before scoring, longer analysis_params
# max_tokens) was tried and reverted — real-run comparison showed no
# measurable improvement in final judged accuracy over this simpler
# version, so it wasn't worth the extra generation time. See
# docs/verifier_score_belief_update.md Section 13.1 for that experiment's
# numbers if revisiting this decision later.
# Params: {rubric} {question} {trajectory_a} {trajectory_b}
pairwise_prompt: |
  You are an expert agricultural scientist reviewer. You will see a task description and two trajectories.

  Evaluation Criteria: {rubric}

  Task: {question}

  Trajectory A: {trajectory_a}
  Trajectory B: {trajectory_b}

  Write 2-4 sentences comparing what each trajectory actually diagnoses and how well it matches the visual evidence and the evaluation criteria above. Name the specific difference between A and B — do not just restate that both look reasonable, and do not treat them as tied unless one is genuinely indistinguishable from the other in correctness. You will be asked for a numeric score for each trajectory (1-20 scale: 1 = incorrect, 10 = borderline, 20 = correct) immediately after this analysis, so make sure your analysis actually justifies whatever gap (or lack of gap) you're about to score.

  Analysis:

# --rephrase only. Params: {question}. Text-only (no image) — this asks
# the model to reword a QUESTION, not analyze an image, so no visual
# input is needed here (see the header comment above for the full
# rationale). Sampled rephrase_count times at --rephrase_temperature in
# one call, made once per (dataset, class) group before round 1.
question_rephrase_prompt: |
  Rephrase the following question in different words, keeping its exact meaning and intent unchanged — do not broaden, narrow, or otherwise change what is being asked. Do not answer the question yourself. Return ONLY the rephrased question text, with no preamble, quotation marks, or explanation.

  Question: {question}

  Rephrased question:

# --multi_hypothesis only. Params: {question} {n_hypotheses}. Replaces the
# default "sample the same question K times at temperature" generation with
# ONE response carrying n_hypotheses DISTINCT candidate answers, each with
# its own brief visual justification. Motivation (measured on a real run):
# plain temperature sampling collapsed 35.6% of image-rounds onto only 1-2
# distinct answers among K=8 candidates, and a traced failure case drifted
# through 10 rounds of generic "Leaf Spot" variants without ever proposing
# the correct "Sigatoka" family at all — i.e. the right hypothesis was
# never in the pool for the tournament to rank. Explicitly demanding
# several MUTUALLY DIFFERENT diagnoses puts a real hypothesis spread in
# front of the verifier instead of hoping sampling stumbles onto it.
#
# Each block needs its own visual justification (not a bare class name):
# the pairwise verifier scores trajectories against rubric criteria
# (symptom color, pattern, texture), so an unjustified label would score
# uninformatively. The <answer></answer> tag convention matches the
# single-answer path, so extract_answer_tag works per block unchanged —
# and _parse_hypotheses anchors on those tags rather than the list
# numbering, which is why the numbering style here is not load-bearing.
multi_hypothesis_prompt: |
  You are an expert agricultural scientist examining this image.

  Question: {question}

  Propose {n_hypotheses} DIFFERENT plausible answers to that question — genuinely distinct possibilities, not restatements of the same conclusion in different words. Include the possibilities you consider most likely as well as ones that are plausible but less obvious, so that a reviewer comparing them has a real range to weigh.

  Format your response as a numbered list with exactly {n_hypotheses} entries. For each entry, write one or two sentences naming the SPECIFIC visual evidence in the image that would support that answer — cite the actual colors, patterns, shapes, or textures you observe — then close the entry by restating that single answer wrapped in <answer></answer> tags.

  Example of the required format for one entry:
  1. The leaf shows irregular dark brown lesions ringed with yellow haloes, concentrated along the leaf margin. <answer>Early Blight</answer>

  Give exactly {n_hypotheses} entries, each with a different answer.
