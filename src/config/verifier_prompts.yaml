# Verifier prompt templates for Stage 4 (verifier-cot) — single-round
# K-candidate + PPT-tournament verifier, see docs/stage4_verifier.md.
#
# - pairwise_prompt — used by the single-round verifier's PPT tournament
#   duels (ranking the pool) AND by src/verifier_lmv.py's own PPT baseline — the
#   dual-trajectory scoring template (arXiv:2607.05391 Section 3.2:
#   <score_A>/<score_B> tags, two-pass teacher-forced/prefill logprob
#   extraction via src/common/ppt_scoring.py). Originally a fixed Python
#   template (not meant to be edited, a "citable reproduction of the
#   paper's prompt") — moved here after a real run showed the paper's own
#   template needed two fixes: (1) it embedded the literal <score_A>/
#   <score_B> tags right after the "analyze, then score" instruction,
#   which caused the model to skip analysis almost entirely (99.6% empty
#   analysis on a 20k-pair sample) rather than write free text first — the
#   tags are no longer shown here at all, they're only ever supplied by
#   pass 2's forced continuation (src/common/ppt_scoring.py::
#   build_score_prompt), never sampled freely; (2) the rating rule was
#   lenient enough that 80.6% of a real sample scored BOTH trajectories
#   above 0.9 — added an explicit anti-tie instruction. So this is now OUR
#   adapted version of the paper's template, not a verbatim reproduction —
#   which is exactly why it belongs here (edit-without-redeploy, and a
#   single citable record for the paper) rather than staying hardcoded.
#   Params: {rubric} {question} {trajectory_a} {trajectory_b}
# - structured_templates — the CANDIDATE GENERATION prompt (every K
#   candidate, every round). Keyed the same way as `rubrics` below (by
#   rubric key, looked up via task_type_to_rubric) so each task type's
#   template asks about exactly the visual dimensions that task's own
#   rubric will later score against — but phrased as blank fields for the
#   model to fill in, NOT as the rubric's own "does it..." verifier-facing
#   question wording. Replaced two earlier, reverted approaches: (1)
#   sampling one free-form answer K times at temperature — real-run
#   tracing found trajectories routinely skipped specific evidence (e.g.
#   never mentioning the yellow discoloration that distinguishes Yellow
#   from Black Sigatoka) even though desc-aug's oracle-description upper
#   bound proved that detail visibly mattered when present; (2) asking for
#   several DIFFERENT hypotheses in one response (multi_hypothesis) — only
#   15.6% of wrong predictions even had the correct answer among the 6
#   proposed, because forcing deliberate diversity competes against the
#   model's own best-calibrated guess rather than sharpening it. A
#   fill-in-template targets the (1)-style failure directly: forcing an
#   explicit color/pattern/texture observation BEFORE the model is allowed
#   to conclude, using the same structure the rubric already checks for,
#   without needing multiple generation calls or oracle data. Still
#   sampled k_candidates times per round for pool diversity/PPT ranking,
#   same as the original single-answer path. Ends in the same
#   <answer></answer> convention, so extract_answer_tag needs no changes.
#   Params: {question}
#
# Rubrics are diagnostic reference material shown to the VERIFIER only —
# never to the model being tested — derived from cot_prompts.yaml's step
# content, same precedent as src/verifier_vision.py's inline
# _RUBRIC_DISEASE/_RUBRIC_WEED (moved here so they're edit-without-redeploy,
# same convention as cot_prompts.yaml's step chains).

rubrics:
  disease_pest: |
    1. Does it correctly identify the crop or plant species affected?
    2. Does it match the pattern of affected plant parts visible (leaves, stem, fruit, roots)?
    3. Does it align with the visible symptom characteristics — color, shape, and texture of damage?
    4. If pest-related, does it account for visible pest signs (webbing, frass, eggs, insect bodies)?
    5. Does it reflect whether the damage is systemic/uniform or isolated/localized?
    6. Is the stated condition (disease name, pest, or stress type) visually consistent with the image?
  species_identification: &species_identification_rubric |
    1. Does it match the visible leaf arrangement, shape, margins, and venation pattern?
    2. Does it align with the plant's growth habit (erect, prostrate, climbing) and stem characteristics?
    3. If flowers or seed structures are visible, does the prediction account for them?
    4. Is the botanical identification (Scientific Name and/or Common Name) consistent with all visible features?
  weed_identification: *species_identification_rubric
  quality_identification: |
    1. Does it match the visible size and shape relative to a typical mature specimen?
    2. Does it align with the observed color and its position between unripe and overripe/spoiled?
    3. Does it account for the visible surface texture and firmness cues (bruising, wrinkling, gloss, softness)?
    4. Is the stated quality/ripeness/condition visually consistent with the image?

# Candidate GENERATION prompt (every K candidate, every round) — see the
# structured_templates entry in the header comment above for the full
# rationale. Keyed identically to rubrics above (task_type_to_rubric maps a
# dataset's task_type to one of these keys). Each template's blank fields
# mirror its rubric's numbered criteria 1:1, but phrased as first-person
# observations for the model generating the answer, not the rubric's own
# verifier-facing "does it..." question wording.
structured_templates:
  disease_pest: |
    {question}

    Answer by filling in each line below based on what you directly observe in the image. Keep each line brief — a few words to one short phrase, not a full sentence.

    Crop or plant species affected:
    Plant part(s) showing symptoms (leaves / stem / fruit / roots):
    Symptom color, shape, and texture:
    Visible pest signs, if any (webbing, frass, eggs, insect bodies — or "none observed"):
    Damage pattern (systemic/uniform across the plant, or isolated/localized):
    Diagnosis (disease name, pest, or stress type):

    After filling in every line above, restate your Diagnosis line's answer wrapped in <answer></answer> tags (e.g. <answer>Early Blight</answer>) — as briefly and precisely as you can state it, not a full sentence.
  species_identification: &species_identification_template |
    {question}

    Answer by filling in each line below based on what you directly observe in the image. Keep each line brief — a few words to one short phrase, not a full sentence.

    Leaf arrangement, shape, margins, and venation pattern:
    Growth habit (erect / prostrate / climbing) and stem characteristics:
    Flower or seed structures, if visible (or "not visible"):
    Species identification (Scientific Name and/or Common Name):

    After filling in every line above, restate your Species identification line's answer wrapped in <answer></answer> tags (e.g. <answer>Amaranthus retroflexus</answer>) — as briefly and precisely as you can state it, not a full sentence.
  weed_identification: *species_identification_template
  quality_identification: |
    {question}

    Answer by filling in each line below based on what you directly observe in the image. Keep each line brief — a few words to one short phrase, not a full sentence.

    Size and shape relative to a typical mature specimen:
    Observed color and its position between unripe and overripe/spoiled:
    Surface texture and firmness cues (bruising, wrinkling, gloss, softness):
    Quality/ripeness assessment:

    After filling in every line above, restate your Quality/ripeness assessment line's answer wrapped in <answer></answer> tags (e.g. <answer>Overripe</answer>) — as briefly and precisely as you can state it, not a full sentence.

# Maps dataset task_type (src/config/datasets.yaml) -> rubric key above —
# mirrors cot_prompts.yaml's task_type_to_cot routing.
task_type_to_rubric:
  disease:                 disease_pest
  pest_damage:              disease_pest
  species_identification:  species_identification
  weed_identification:     weed_identification
  quality_identification:  quality_identification

# The single-round verifier's PPT tournament duels AND src/verifier_lmv.py's PPT
# baseline. This is the free-generation (pass 1) prompt only — it
# deliberately does NOT show the <score_A>/<score_B> tags (see the header
# comment above for why); pass 2's forced continuation supplies them
# separately via src/common/ppt_scoring.py::build_score_prompt. Trajectory
# text is truncated to ~500 chars by _truncate_keep_answer before this
# template is filled (never mid-<answer>-tag).
#
# A per-criterion walkthrough version (requiring the analysis to check
# each rubric item individually before scoring, longer analysis_params
# max_tokens) was tried and reverted — real-run comparison showed no
# measurable improvement in final judged accuracy over this simpler
# version, so it wasn't worth the extra generation time. See
# docs/legacy/verifier_score_belief_update.md Section 13.1 for that experiment's
# numbers if revisiting this decision later.
# Params: {rubric} {question} {trajectory_a} {trajectory_b}
pairwise_prompt: |
  You are an expert agricultural scientist reviewer. You will see a task description and two trajectories.

  Evaluation Criteria: {rubric}

  Task: {question}

  Trajectory A: {trajectory_a}
  Trajectory B: {trajectory_b}

  Write 2-4 sentences comparing what each trajectory actually diagnoses and how well it matches the visual evidence and the evaluation criteria above. Name the specific difference between A and B — do not just restate that both look reasonable, and do not treat them as tied unless one is genuinely indistinguishable from the other in correctness. If either trajectory's stated answer has a visually similar but distinct condition it could easily be confused with (e.g. Black Sigatoka vs. Yellow Sigatoka, or two look-alike species), explicitly check whether the trajectory's cited evidence actually distinguishes between them — not just whether it names a plausible general category. Immediately after this analysis you will be asked to rate each trajectory on a 20-point letter scale from A to T (A = clearly and completely correct, T = clearly and completely incorrect, with the letters in between spanning that range), so make sure your analysis actually justifies whatever gap (or lack of gap) you're about to score.

  Analysis:
