# Detection analog of src/config/verifier_prompts.yaml — Stage 5d
# (detection_verifier.py). See that file's header comment for the full
# rationale behind each entry's shape; only what genuinely differs for a
# spatial (box) answer instead of a free-text class label is re-explained
# here.
#
# - rubric — verifier-facing localization-quality criteria (mirrors
#   verifier_prompts.yaml's disease_pest rubric shape exactly).
# - structured_templates — candidate GENERATION prompt: criteria filled in
#   BEFORE boxes are reported, exactly mirroring disease_pest's
#   fill-in-the-blank pattern (this is the explicit design requirement:
#   "the baseline prints boxes directly with no reasoning; the verifier
#   must answer structured localization criteria BEFORE printing boxes").
#   The final box list is wrapped in <answer>...</answer> (with <box> tags
#   nested inside) rather than bare <box> tags at the top level — this is
#   NOT cosmetic: src/common/ppt_scoring.py's _truncate_keep_answer looks
#   for a literal "<answer>" tag to preserve when a trajectory exceeds its
#   500-char cap for pairwise scoring, so wrapping the box list in
#   <answer></answer> gets that truncation-preservation behavior for free,
#   the same way classification's plain <answer>ClassName</answer> does —
#   without it, a long trajectory could get truncated mid-box-list.
# - pairwise_prompt — reused VERBATIM from verifier_prompts.yaml (Python
#   side loads that file's key directly; not duplicated here) — see this
#   file's own header comment for why it needs no changes: it scores TEXT
#   trajectories against a rubric, and a detection trajectory (criteria
#   answers + box list) is still just text.

rubric: |
  1. Does it correctly identify what class/object type is being localized?
  2. Does each box tightly bound its instance without excess background or cut-off parts?
  3. Does it correctly separate overlapping/occluded instances rather than merging them?
  4. Are boxes placed at locations consistent with where the object actually appears (not hallucinated)?
  5. Is the overall box count and placement consistent with the visual evidence?

# direct_template — --gen_mode direct ablation: candidate generation prints
# boxes straight away, identical instruction shape to prompts_detection.yaml's
# detection_baseline template, just taking the already-built {question} as
# input rather than raw {class_names}/{crop} — no fill-in-the-blank
# criteria step at all. The PPT tournament + rubric-based pairwise scoring
# (below) is UNCHANGED either way; this only controls what a candidate's
# own generation call looks like, isolating whether the structured-criteria
# GENERATION step itself helps or hurts for detection, independent of
# whether K-candidate sampling + tournament selection helps.
# Params: {question}
direct_template: |
  {question} For each one you find, report its bounding box on its own line, using this exact
  format:
  <box>x1,y1,x2,y2</box>

  Coordinates are pixel positions in the image as shown: (x1,y1) is the
  top-left corner, (x2,y2) is the bottom-right corner. Report one box per
  line, nothing else. If none are visible, respond with exactly:
  <box>none</box>

# Gemma-family JSON variant of direct_template above — see
# prompts_detection.yaml's detection_baseline_json header comment for the
# full root-cause rationale (native box_2d/y-first format vs. the <box>
# tag's silent axis-order reversion). Selected the same way, via
# bbox_parse.uses_json_box_format(model_id).
# Params: {question}
direct_template_json: |
  {question} Respond with ONLY a JSON array, one object per instance found,
  each with exactly these two keys:
  "box_2d": [y_min, x_min, y_max, x_max] — coordinates on a 0-1000
  normalized scale (top-left corner of the image is [0, 0]), in that exact
  order.
  "label": the class name for that instance.

  If none are visible, respond with exactly: []

# Params: {question}
structured_templates:
  object_detection: |
    {question}

    Answer by filling in each line below based on what you directly observe in the image. Keep each line brief — a few words to one short phrase, not a full sentence.

    Object/class being localized (and any other names it is commonly referred to as):
    General location(s) in the image (e.g. upper-left, center, scattered):
    Overlapping or occluded instances, if any (or "none"):
    Approximate size of each instance relative to the image:

    After filling in every line above, wrap your final answer in <answer></answer> tags containing one <box>x1,y1,x2,y2</box> line per instance (pixel coordinates, top-left to bottom-right), e.g.:
    <answer><box>120,45,340,210</box>
    <box>500,100,620,300</box></answer>
    If none are visible, write exactly: <answer><box>none</box></answer>

# Gemma-family JSON variant of structured_templates.object_detection above
# — same fill-in-the-blank criteria step, but the final answer format asks
# for box_2d JSON instead of <box> tags (see direct_template_json above
# for the root-cause rationale). Still wrapped in <answer></answer> around
# the JSON array itself, for the same truncation-preservation reason
# described in this file's header comment.
# Params: {question}
structured_templates_json:
  object_detection: |
    {question}

    Answer by filling in each line below based on what you directly observe in the image. Keep each line brief — a few words to one short phrase, not a full sentence.

    Object/class being localized (and any other names it is commonly referred to as):
    General location(s) in the image (e.g. upper-left, center, scattered):
    Overlapping or occluded instances, if any (or "none"):
    Approximate size of each instance relative to the image:

    After filling in every line above, wrap your final answer in <answer></answer> tags containing ONLY a JSON array, one object per instance, each with exactly these two keys: "box_2d": [y_min, x_min, y_max, x_max] (0-1000 normalized scale, top-left origin) and "label": the class name, e.g.:
    <answer>[{{"box_2d": [45, 120, 210, 340], "label": "apple"}}, {{"box_2d": [100, 500, 300, 620], "label": "apple"}}]</answer>
    If none are visible, write exactly: <answer>[]</answer>

# detection-box-verifier (Stage 4, docs/stage4_detection_verifier.md) —
# per-box confidence grading: each predicted box's CROP (padded, see
# detection_box_verifier.py's crop_box) is shown to the verifier ALONE —
# not the full image, not the other predicted boxes — and graded against
# these criteria independently on a 1-3 scale, summed/normalized to a
# per-box confidence in [0, 1]. Same summed-rubric mechanic
# verifier_prompts.yaml's grading_prompt uses for a whole classification
# trajectory (src/verifier_cot.py's _parse_criterion_scores/
# _normalize_criterion_scores are reused directly, unchanged), just
# applied per-box instead of per-trajectory — there is no single
# verifier_score per image here, only one confidence per predicted box.
# No ground truth shown — purely a visual plausibility check against the
# model's OWN stated category/sub-type label (box_rubric criterion 4),
# never leaking the dataset's actual GT convention into the grading.
box_rubric: |
  1. Does this crop show a real instance of the stated category (not background, foliage, or something else mistaken for it)?
  2. Is the box reasonably tight around this one instance (not badly cut off, not mostly excess background)?
  3. Does this crop show exactly ONE instance of the object, not multiple instances merged into a single box?
  4. Is the stated sub-type or condition plausible given what's actually visible in this crop?

# Params: {rubric} {label}
box_grading_prompt: |
  You are an expert agricultural computer vision reviewer. You are shown a CROPPED region of a larger image, along with the label a detection model assigned to it: "{label}".

  Evaluation Criteria:
  {rubric}

  Grade how well this crop satisfies EACH numbered criterion above, independently, on this 3-point scale:
    1 = not satisfied — no supporting visual evidence in this crop
    2 = partially satisfied — some supporting evidence, but incomplete or unclear
    3 = fully satisfied — clear, specific supporting evidence visible in this crop

  Output exactly one line per numbered criterion above, in this format (N is that criterion's own number, SCORE is 1, 2, or 3):
  <criterion_N>SCORE</criterion_N>

  Grades:
