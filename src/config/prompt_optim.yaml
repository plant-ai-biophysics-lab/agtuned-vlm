# Prompt optimisation config
# Used by src/prompt_optim/optimise.py
#
# Variable tokens used in prompt templates:
#   {crop}         — crop name, e.g. "tomato", "corn"
#   {cls}          — target class name, e.g. "Early Blight"
#   {class_list}   — comma-separated list of all valid class names for this dataset
#   {n_candidates} — number of candidate prompts the optimizer must return

# ── Evaluation prompts ─────────────────────────────────────────────────────────

# Starting point before any optimisation.
base_prompt: >-
  What disease or condition is shown in this image of a {crop}?

# Used during optimisation (train classes).
# Including the class list maximises resolvable predictions via substring
# matching and gives the optimiser a clean F1 signal to improve against.
closed_form_prompt: >-
  What condition is shown in this image of a {crop}?
  Choose from: {class_list}.
  Reply with only the condition name.

# Used as the base comparison on the test set — no class list, matches current
# pipeline behaviour (resolve_predicted_class substring matching).
open_ended_prompt: >-
  What disease, pest, or stress condition is shown in this image of a {crop}?
  Describe any visible symptoms and name the specific condition.

# ── Meta system prompt (candidate generation) ─────────────────────────────────

meta_system_prompt: |
  You are an agricultural computer vision expert specialising in plant disease,
  pest, and stress identification.

  Your task is to generate improved question prompts for classifying specific
  crop conditions in farm images. The prompts will be passed as instructions
  to vision-language models (VLMs) such as Gemma-4 and Qwen, each paired with
  a single crop image. The model must respond by naming the condition shown.

  The prompt you generate will be evaluated using substring matching: the
  model's response is scanned for a known class name. A prompt that encourages
  the model to state the exact condition name clearly will score higher.

  Prompts should include the class list placeholder {class_list} so the model
  knows what options are valid. Use {crop} where referring to the crop type.

  You will be shown:
    1. The crop type and target class you must improve prompts for.
    2. A consolidated summary of insights from all classes optimised so far
       (may be empty on the first class).
    3. The best-scoring prompt so far and the most recently tested prompt
       for this class.

  Use the consolidated insights to inform your suggestions — if a pattern has
  improved F1 across multiple classes or crops, try applying it here. Then
  generate fresh candidates that push beyond what has already been tried.

  Return a JSON array of EXACTLY {n_candidates} prompt strings and nothing else.
  Each prompt must contain {class_list} and may contain {crop}.

  Example for class "Early Blight" on "Tomato":
  [
    "What condition is shown in this image of a {crop}? Choose from: {class_list}. Focus on any spots or lesions on the leaves before answering.",
    "Examine the color, shape, and distribution of any abnormalities on this {crop} plant. Which condition from the following list is present: {class_list}?",
    "Look closely at the leaf surface of this {crop}. Based on the visible symptoms, select the correct condition from: {class_list}. Reply with only the condition name."
  ]

# ── Per-class summary (written after each class completes) ────────────────────

class_summary_system: |
  You are an agricultural computer vision research assistant. You have just
  completed prompt optimisation for a single crop condition class.

  Write a concise 2-4 sentence summary capturing:
    1. What the best prompt looked like and why it likely worked.
    2. What prompt styles failed or showed no improvement.
    3. Any class-specific visual features that seemed important to reference
       in the prompt (e.g. lesion colour, shape, distribution pattern).

  Be specific — name the crop, condition, and exact prompt features. This
  summary will later be consolidated with other class summaries to extract
  cross-cutting patterns.

class_summary_user: |
  Crop: {crop}
  Class: {cls}
  Dataset: {dataset}
  Base F1: {base_f1}
  Best F1: {best_f1}
  F1 gain: {gain}

  Base prompt:
  {base_prompt}

  Best prompt found:
  {best_prompt}

  All prompts tested (iteration, candidate, prompt, F1):
  {prompts_tested}

  Write a concise summary of what worked and why for this class.

# ── Consolidated summary (distilled from all per-class summaries so far) ──────

consolidation_system: |
  You are an agricultural computer vision research assistant maintaining a
  growing knowledge base of prompt engineering insights for vision-language
  models (VLMs) classifying crop conditions from images.

  Responses are evaluated via substring matching: the model's free-text output
  is scanned for a known class name. Prompts that improve resolvability and
  correctness score higher.

  You will be given all per-class summaries written so far, plus the previous
  consolidated summary. Your job is to distil these into an updated consolidated
  summary that captures:
    1. Per-model patterns — what prompt styles consistently work or fail for
       each VLM (Gemma-4, Qwen, etc.).
    2. Crop / condition patterns — e.g. "asking the model to describe lesion
       shape before selecting a class improves F1 for fungal diseases".
    3. Cross-cutting generalisable insights — trends that hold across multiple
       crops, datasets, and task types.
    4. Failure patterns — prompt styles that consistently underperform.
    5. Any surprising or counter-intuitive findings.

  Write 6-12 sentences of plain text. Be concrete: name crops, task types,
  and specific prompt features. Do not include JSON, bullet points, or headers.

consolidation_user: |
  === Per-class summaries (all classes completed so far) ===
  {per_class_summaries}

  === Previous consolidated summary ===
  {previous_consolidated}

  Please write an updated consolidated summary.

# ── Test prompt generation (uses consolidated summary, no loop) ───────────────

test_prompt_system: |
  You are an agricultural computer vision expert. You have a knowledge base of
  prompt engineering insights built from optimising prompts across multiple crop
  disease, pest, and weed datasets.

  Your task is to write a single open-ended classification prompt for a new crop
  condition class that you have not seen before. Apply the patterns from the
  knowledge base to write the best prompt you can.

  The prompt must NOT include a class list — the model should name the condition
  from its own knowledge. Use {crop} where referring to the crop type.

  Return only the prompt string — no JSON array, no explanation.

test_prompt_user: |
  === Consolidated knowledge base ===
  {consolidated_summary}

  === Task ===
  Crop: {crop}

  Write one open-ended prompt for classifying conditions on this crop (no class list).

# ── LLM-as-judge (test set only) ─────────────────────────────────────────────

judge_system: |
  You are an expert agricultural image classification judge. Determine whether
  a model's free-text response correctly identifies the plant condition.

  Reply with exactly one word: "Yes" if the response is correct, "No" otherwise.
  A response is correct if it names or clearly describes the true condition,
  even if the wording is not exact (e.g. "early blight" matches "Early Blight").

judge_user: |
  True condition: {true_class}
  Crop: {crop}
  Model response: {response}

  Did the model correctly identify the condition? Reply Yes or No.

# ── Optimisation hyperparameters ──────────────────────────────────────────────

optimizer_model: meta-llama/Llama-3.2-1B-Instruct
n_candidates: 5          # candidate prompts generated per iteration
n_iterations: 10         # optimisation iterations per class
optimizer_temperature: 0.8
classifier_temperature: 0.0   # greedy decoding for evaluation — deterministic F1
max_tokens_response: 64       # max tokens for VLM classification response
max_tokens_optimizer: 512     # max tokens for Llama candidate generation
max_tokens_summary: 384       # max tokens for per-class and consolidated summaries
max_tokens_test_prompt: 128   # max tokens for test prompt generation
max_tokens_judge: 8           # judge only needs "Yes" or "No"

# ── Logging ───────────────────────────────────────────────────────────────────

# All of the following are written to output_dir/:
#   run_log.jsonl                  — one record per candidate evaluated
#   test_log.jsonl                 — one record per test class (base vs opt)
#   best_prompts.json              — best prompt per class at end of train
#   per_class_summaries.jsonl      — per-class summary after each train class
#   consolidated_summary_history.jsonl — consolidated summary after each class
#   results.json                   — final F1 per class / dataset / task / overall
#   plots/                         — bar charts + t-SNE overlay

# ── Train / test split ────────────────────────────────────────────────────────
# Split definition lives in a separate file so other scripts can load it
# independently without depending on this prompt-optimisation config.

split_config: src/config/dataset_split.yaml
