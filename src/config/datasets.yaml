# AgML image classification datasets, sourced from https://huggingface.co/Project-AgML.
# Regenerated by scripts/agml_hf/migrate_datasets_yaml.py — see
# outputs/migration/datasets_migration_review.md for the review log of this run.
#
# task_type options:
#   disease                 - leaf/plant disease classification
#   pest_damage             - insect/pest classification or physical/abiotic damage
#   species_identification  - weed/plant/variety/cultivar species-or-variety ID
#                             (formerly split across weed_identification and the
#                             variety-ID portion of crop_identification)
#   quality_identification  - ripeness/grade/quality/maturity/defect assessment
#                             of an already-known crop (formerly the
#                             quality/ripeness portion of crop_identification)
#
# NOTE: weed_identification/crop_identification were retired in favor of the
# species_identification/quality_identification split above — some downstream
# scripts outside src/linear_probe/ still hardcode the old names (verifier
# rubrics, CoT question branching, plotting palettes) and have NOT been
# updated yet; they'll break or silently mis-group until they're migrated.
#
# skip: true          - exclude dataset entirely from generation
# hf_config            - which HF dataset config/split-group to load (e.g. "raw" vs "augmented")
#
# Q3/Q4 (description questions) are only generated for
# task_type: disease | pest_damage.
# Datasets with task_type: species_identification | quality_identification
# get Q1/Q2 only.

