  - arabica_coffee_leaf_disease_classification  # africa/kenya · 5 classes · 58 549 imgs
  - coconut_tree_disease_classification         # asia/india · 5 classes · 5 798 imgs
  - tea_leaf_disease_classification             # asia/india · 6 classes · 5 867 imgs
  - java_plum_leaf_disease_classification       # asia/bangladesh · 6 classes · 2 400 imgs
  - sunflower_disease_classification            # asia/bangladesh · 4 classes · 2 358 imgs
  - cucumber_disease_classification             # asia/bangladesh · 8 classes · 7 689 imgs
