# Dataset train / test split
#
# Stratified by task_type so every task is represented in both halves.
# Train: run full optimisation loop (generate candidates → evaluate → update summary).
# Test:  apply accumulated summary; evaluate base prompt and best summary-derived
#        prompt only — no further optimisation loops.
#
# Split criteria:
#   - Equal task_type counts across train/test within each type
#   - Geographic diversity balanced across both splits
#   - Mix of single-crop and multi-crop datasets in both splits
#   - Mix of small (<500 imgs) and large (>10k imgs) datasets in both splits

train:
  # disease (11 of 22)
  - bean_disease_uganda            # africa · 3 classes · 1 295 imgs
  - plant_village_classification   # north_america · 39 classes · 55 448 imgs · multi-crop
