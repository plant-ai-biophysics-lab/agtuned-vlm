  per-species summaries above — don't invent a generic botany checklist
  from nothing. This section is what lets the reader apply SOMETHING
  useful to a species it has never seen named anywhere in this document;
  the sections below are useful only for species that happen to match.

  ## What Worked
  (organized by category — plant, weed — only include categories with
  real content above; per-species entries naming a specific species and
  its distinguishing features, same as before)

  ## What Didn't Work
  (same categories — concrete, actionable guidance, not vague warnings)

  Keep it concrete and skimmable — short bullets, not paragraphs. Do not
  invent facts not supported by the summaries above. Do not add a
  "Common Species to Know" style reference list whose bullets are just
  bare species names restated as standalone entries — the per-species
  bullets under What Worked/Didn't Work are fine (they carry real
