# Paper 2, Stage 3 (docs/stage3_context_memory.md) — prompts for building
# the held-out Digital Green skill-memory .md file. Kept separate from
# prompts.yaml/verifier_prompts.yaml since these are specific to this
# one held-out dataset's own lesson-writing pipeline, not reused anywhere
# else.

# System prompt for every lesson-writing call (both "what didn't work"
# misses and "what worked" corrects — ALL of Step 1's rows get a trace,
# not just misses) — operationalizes the general
# trends found in heldout-zeroshot's real Step 1 results (n=827,
# judge_accuracy=0.3881), NOT hard-coded per-crop/per-diagnosis facts:
#   - 149/827 rows were a false "Healthy" (the single largest error
#     bucket, bigger than any specific category confusion) — the model
#     over-predicts "Healthy" as a safe default when actually unsure.
#   - Pest/insect damage is the hardest category to recognize at all
#     (32.7% bucket accuracy vs. 60.4% disease, 71.0% healthy) — the
#     model defaults to a disease explanation rather than considering
#     insect damage as a hypothesis.
#   - Nutrient deficiency is frequently confused with disease or missed
#     entirely (19.4% bucket accuracy, n=36 — suggestive, not solid).
# These are deliberately stated as GENERAL reminders here, not facts
# about any specific image — the lesson-writing calls below ground their
# OWN explanations in each image's own visible evidence + the expert's
# own observations, not in these trend stats directly.
heldout_lesson_system: |
  You are an expert agricultural scientist writing short training notes
  for another vision-language model that frequently makes these general
  mistakes when diagnosing crop photos — keep them in mind to decide
  which details are worth emphasizing, but never restate them as facts
  about the specific image in front of you:
  - It over-predicts "Healthy" as a safe default when it's actually
    unsure, missing real problems more than any other single error.
  - It is much worse at recognizing PEST/insect damage than disease — it
    tends to default to a disease explanation (fungal/bacterial/viral
    symptom pattern) rather than seriously considering insect damage as
    a hypothesis.
  - It frequently confuses nutrient deficiency with disease, or misses
    deficiency symptoms entirely.
  Write concrete, visually-grounded notes — actual colors, shapes,
  patterns, insect signs visible in THIS image — never vague
  generalities like "look more carefully."

# "what didn't work" — Params: {crop} {model_reasoning} {wrong_prediction} {ground_truth} {expert_details}
heldout_explain_miss_prompt: |
  A vision-language model was shown this image of a {crop} plant and
  asked to diagnose any disease, pest, or nutrient deficiency affecting
  it (or state that it's healthy). It answered INCORRECTLY.

  The model's own stated reasoning: "{model_reasoning}"
  Its final answer (WRONG): "{wrong_prediction}"
  The ACTUAL correct answer: "{ground_truth}"
  An expert agronomist's own observations of this image: "{expert_details}"

  In 2-4 sentences, explain what specific visual evidence (visible in
  THIS image) should have led to the correct answer instead — point out
  specifically where the model's own stated reasoning went wrong
  (misread evidence, missed a sign entirely, jumped to a conclusion,
  etc.), grounded in the expert's own observations above wherever
  possible, not speculation. If the mistake was confusing two
  similar-looking categories (e.g. a pest sign mistaken for a disease
  symptom, or vice versa, or a deficiency mistaken for a disease), say
  specifically what distinguishes them in this case.

  Respond with ONLY the explanation text — no headers, no restating the
  question.

# "what worked" — Params: {crop} {model_reasoning} {correct_prediction} {ground_truth} {expert_details}
heldout_explain_correct_prompt: |
  A vision-language model was shown this image of a {crop} plant and
  asked to diagnose any disease, pest, or nutrient deficiency affecting
  it (or state that it's healthy). It answered CORRECTLY.

  The model's own stated reasoning: "{model_reasoning}"
  Its final answer: "{correct_prediction}" (matches the correct answer:
  "{ground_truth}")
  An expert agronomist's own observations of this image: "{expert_details}"

  In 2-4 sentences, confirm and articulate the specific visual evidence
  (visible in THIS image) that correctly supports this diagnosis —
  ground your explanation in the expert's own observations above
  wherever possible. IMPORTANT: if the model's own stated reasoning
  actually cited the WRONG evidence or reasoned unsoundly despite
  landing on the correct final answer (a lucky guess, not real
  diagnostic skill), say so explicitly instead of crediting reasoning
  that wasn't actually sound — do not manufacture a justification for
  reasoning that doesn't deserve it.

  Respond with ONLY the explanation text — no headers, no restating the
  question.

# Step 3 (heldout_summarize.py) — map phase. Summarizes ONE chunk of
# Step 2 explanations (all from the same heuristic category + trace_type
# bucket — see bucket_category() in heldout_zeroshot.py — split further
# into word-count-bounded chunks when a bucket is too large for one
# context window) into a short bullet list of RECURRING, GENERALIZABLE
# patterns, text-only (no image — these are already-written explanations
# about images, not the images themselves).
# Params: {category} {trace_type_label} {n} {explanations_block}
heldout_map_summarize_prompt: |
  Below are {n} short explanations written about {trace_type_label} when
  a vision-language model diagnosed crop images in the "{category}"
  category. Each explanation describes ONE specific image's visual
  evidence.

  {explanations_block}

  Summarize the RECURRING, GENERALIZABLE patterns across these
  explanations — not a list restating each one individually, and not
  facts about any single image. Write 4-8 bullet points covering: common
  visual cues that correctly identify this category, common mistakes or
  confusions to watch for, and anything distinctive about this category
  worth remembering. Be concrete (colors, shapes, patterns, insect
  signs) — never vague advice like "look more carefully."

  IMPORTANT: this reader will eventually use these notes to NAME a
  diagnosis. Every bullet must point toward a SPECIFIC diagnosis name
  (e.g. "Fall armyworm", "Downy Mildew", "Nitrogen Deficiency"), never a
  bare category label on its own ("Pest", "Disease", "Chewing pests",
  "Sucking pests", "Viral infection"). It is fine to mention a category
  word as part of a sentence describing what to look for, but never
  write a bullet whose ENTIRE content IS just the category name — a
  reader skimming for an answer must never be able to lift a bare
  category word as if it were a valid diagnosis.

  Respond with ONLY the bullet list (plain "- " bullets, no headers, no
  preamble).

# Step 3 — reduce phase. Merges every chunk-level bullet summary from
# the map phase into ONE final skill-memory .md file — the artifact
# Step 4 ablates and, if it helps, injects into vision-baseline/
# verifier-cot.
# Params: {chunk_summaries_block}
heldout_reduce_summarize_prompt: |
  Below are bullet-point summaries gathered from reviewing a vision-
  language model's crop diagnosis attempts, grouped by category and by
  whether the model got it right ("what worked") or wrong ("what didn't
  work"):

  {chunk_summaries_block}

  Write a single, well-organized reference document (Markdown) for
  another instance of this same model to read BEFORE attempting crop
  diagnosis — its job is to help that model avoid the same mistakes and
  reuse what already works. Structure:

  # Crop Diagnosis — Lessons Learned

  ## What Worked
  (organized by category — disease, pest, nutrient deficiency, healthy —
  only include categories with real content above)

  ## What Didn't Work
  (same categories — concrete, actionable guidance, not vague warnings)

  Do NOT add a "Common Diseases/Pests/Conditions to Know" style
  reference list, or any other section whose bullets are just bare
  category/condition names restated as standalone entries (e.g. a
  bullet that says only "Chewing Pests:" or "Sucking Pests:") — a reader
  of this document will eventually need to output a SPECIFIC diagnosis
  name, and a section like that reads as a menu of valid short answers,
  which it is not. Every bullet anywhere in this document must point
  toward a specific diagnosis name, never a bare category label on its
  own.

  Keep it concrete and skimmable — short bullets, not paragraphs. Do not
  invent facts not supported by the summaries above.

# Step 3b (heldout_skill_optimize.py) — self-optimization loop. Takes
# the CURRENT skill.md text directly and EDITS it (not a re-summarize
# from traces — this call never sees the original explanation traces,
# only the skill file's own current wording plus this round's own
# eval-split failures), steered by per-task-bucket accuracy and a sample
# of the mistakes the model made WHILE using this exact skill file.
# Params: {current_skill_md} {task_scores_block} {miss_examples_block}
heldout_skill_edit_prompt: |
  Below is the CURRENT version of a reference document another
  vision-language model reads before diagnosing crop disease/pest/
  nutrient-deficiency images. It was just evaluated on a held-out set of
  images WHILE using this exact document, broken down by category:
  {prior_round_feedback_block}
  {task_scores_block}

  Here are specific cases where the model, using this exact document,
  still got the answer wrong:

  {miss_examples_block}

  Here are specific cases where the model, using this exact document,
  got the answer RIGHT — the document is already doing its job for
  these, do not disturb whatever's working for them:

  {worked_examples_block}

  CURRENT DOCUMENT:
  {current_skill_md}

  Revise this document to address the weaker categories above and the
  specific mistakes shown — add, remove, or reword guidance as needed.
  Rules that must still hold in your revision:
  1. Every bullet must point toward a SPECIFIC diagnosis name (e.g.
     "Fall armyworm", "Downy Mildew", "Nitrogen Deficiency") — never a
     bare category word like "Pest", "Disease", "Deficiency", "Chewing
     pests", "Sucking pests", or "Viral infection" standing alone as a
     bullet's entire content.
  2. Write GENERALIZABLE, INSTRUCTIONAL guidance — a visual pattern,
     symptom, or distinguishing cue that would help identify this
     condition across DIFFERENT images of it, not a fact tied to one
     specific example image. The mistakes shown above are EVIDENCE to
     diagnose what kind of guidance is missing, not source text to copy
     from: do NOT lift an "Expert's observations" sentence from a single
     miss example verbatim into a bullet — extract the underlying visual
     principle behind it instead. If a mistake is genuinely a one-off
     with nothing generalizable about it, it is fine to leave it out
     rather than force a bullet out of it. This document's whole purpose
     is to teach a DIFFERENT model to reason about images it has NOT
     seen — a bullet that only makes sense next to the one image that
     prompted it has no value there.
  3. Do NOT add a "Common Diseases/Pests/Conditions to Know" style
     reference list, or any section whose bullets are just bare
     category names restated as standalone entries.
  4. Keep the same overall structure (`# Crop Diagnosis — Lessons
     Learned`, `## What Worked` / `## What Didn't Work`, organized by
     category) unless a category genuinely has nothing useful to say.
  5. Keep it concrete and skimmable — short bullets, not paragraphs. Do
     not invent facts not supported by the mistakes shown or the
     current document's own existing content.
  6. PROTECT what's already working. Before editing a bullet or section
     that plausibly helped produce one of the correct cases shown above,
     check whether your change would still support that case — if a
     category has both correct and wrong cases shown, prefer ADDING a
     new, narrowly-scoped distinction over REWRITING the existing
     wording, so you don't fix one failure by breaking what already
     works. Do not rewrite or remove a bullet just to make room for new
     content when there's no evidence that bullet itself is the
     problem.

  Respond with the full revised document (Markdown), starting with the
  `# Crop Diagnosis — Lessons Learned` heading, no preamble — then, on a
  new line by itself, write exactly:
  ---CHANGELOG---
  followed by a short bullet list (3-8 bullets) of the SPECIFIC changes
  you made and WHY, each bullet naming the category/bucket it addresses
  and referencing the score or mistake that motivated it (e.g. "Added a
  note distinguishing X from Y under Pest/What Didn't Work — pest
  accuracy was the weakest bucket at N%, and 2 of the shown mistakes
  confused X for Y specifically"). Do not skip this section.

