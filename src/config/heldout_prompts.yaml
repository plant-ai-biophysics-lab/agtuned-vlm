# Quality-identification domain (docs/stage3_context_memory.md, quality
# extension) — same Step 1-3b pipeline, same param names as the
# heldout_* templates above, applied to AgML's own 5 held-out
# quality_identification datasets (VegNet_quality_classification,
# banana_bunch_maturity_classification, coffee_bean_quality_classification,
# pomegranate_quality_classification, riseholme_strawberry_classification_2021
# — see datasets.yaml's skip:true notes on each) instead of Digital
# Green. No external expert `details` text exists for these rows (always
# ""), so these templates never reference {expert_details}. Only one
# bucket ("quality" — see bucket_category_quality's docstring for why),
# so no "organized by category" structure is needed the way disease/
# pest/deficiency/healthy's 4-way split needs it.

heldout_quality_lesson_system: |
  You are an expert in post-harvest produce quality assessment, writing
  short training notes for another vision-language model that grades
  fruit/vegetable quality, ripeness, or maturity from photos. Write
  concrete, visually-grounded notes — actual colors, textures, shapes,
  blemishes, size cues visible in THIS image — never vague generalities
  like "look more carefully."

# "what didn't work" — Params: {crop} {model_reasoning} {wrong_prediction} {ground_truth} {expert_details}
heldout_quality_explain_miss_prompt: |
  A vision-language model was shown this image of {crop} produce and
  asked to assess its quality, ripeness, or grade. It answered
  INCORRECTLY.

  The model's own stated reasoning: "{model_reasoning}"
  Its final answer (WRONG): "{wrong_prediction}"
  The ACTUAL correct answer: "{ground_truth}"

  In 2-4 sentences, explain what specific visual evidence (visible in
  THIS image — color, texture, size, blemishes, shape) should have led
  to the correct answer instead — point out specifically where the
  model's own stated reasoning went wrong. If the mistake was confusing
  two similar-looking grades/stages, say specifically what distinguishes
  them in this case.

  Respond with ONLY the explanation text — no headers, no restating the
  question.

# "what worked" — Params: {crop} {model_reasoning} {correct_prediction} {ground_truth} {expert_details}
heldout_quality_explain_correct_prompt: |
  A vision-language model was shown this image of {crop} produce and
  asked to assess its quality, ripeness, or grade. It answered
  CORRECTLY.

  The model's own stated reasoning: "{model_reasoning}"
  Its final answer: "{correct_prediction}" (matches the correct answer:
  "{ground_truth}")

  In 2-4 sentences, confirm and articulate the specific visual evidence
  (visible in THIS image) that correctly supports this grade/stage.
  IMPORTANT: if the model's own stated reasoning actually cited the
  WRONG evidence or reasoned unsoundly despite landing on the correct
  final answer (a lucky guess, not real assessment skill), say so
  explicitly instead of crediting reasoning that wasn't actually sound.

  Respond with ONLY the explanation text — no headers, no restating the
  question.

# Params: {category} {trace_type_label} {n} {explanations_block} — category is always "quality" here.
heldout_quality_map_summarize_prompt: |
  Below are {n} short explanations written about {trace_type_label} when
  a vision-language model assessed produce quality/ripeness/grade in
  images. Each explanation describes ONE specific image's visual
  evidence.

  {explanations_block}

  Summarize the RECURRING, GENERALIZABLE patterns across these
  explanations — not a list restating each one individually, and not
  facts about any single image. Write 4-8 bullet points covering: common
  visual cues that correctly identify a grade/ripeness stage, common
  mistakes or confusions to watch for, and anything distinctive worth
  remembering. Be concrete (color, texture, size, blemishes, shape) —
  never vague advice like "look more carefully."

  IMPORTANT: this reader will eventually use these notes to NAME a
  specific grade/stage label. Every bullet must point toward a SPECIFIC
  label (e.g. "grade-1", "ripe", "AA"), never a bare generic word like
  "Good" or "Bad" standing alone as a bullet's entire content.

  Respond with ONLY the bullet list (plain "- " bullets, no headers, no
  preamble).

# Params: {chunk_summaries_block}
heldout_quality_reduce_summarize_prompt: |
  Below are bullet-point summaries gathered from reviewing a vision-
  language model's produce quality/ripeness/grade assessments, grouped
  by whether the model got it right ("what worked") or wrong ("what
  didn't work"):

  {chunk_summaries_block}

  Write a single, well-organized reference document (Markdown) for
  another instance of this same model to read BEFORE attempting quality
  assessment — its job is to help that model avoid the same mistakes and
  reuse what already works. Structure:

  # Produce Quality Grading — Lessons Learned

  ## What Worked
  ## What Didn't Work

  Keep it concrete and skimmable — short bullets, not paragraphs. Do not
  invent facts not supported by the summaries above. Do not add a
  "Common Grades/Conditions to Know" style reference list whose bullets
  are just bare labels restated as standalone entries.

# Params: {current_skill_md} {task_scores_block} {miss_examples_block} {worked_examples_block} {prior_round_feedback_block}
heldout_quality_skill_edit_prompt: |
  Below is the CURRENT version of a reference document another
  vision-language model reads before assessing produce quality/ripeness/
  grade from images. It was just evaluated on a held-out set of images
  WHILE using this exact document:
  {prior_round_feedback_block}
  {task_scores_block}

  Here are specific cases where the model, using this exact document,
  still got the answer wrong:

  {miss_examples_block}

  Here are specific cases where the model, using this exact document,
  got the answer RIGHT — the document is already doing its job for
  these, do not disturb whatever's working for them:

  {worked_examples_block}

  CURRENT DOCUMENT:
  {current_skill_md}

  Revise this document to address the mistakes shown above. Rules that
  must still hold in your revision:
  1. Every bullet must point toward a SPECIFIC grade/ripeness/stage
     label, never a bare generic word like "Good"/"Bad" standing alone.
  2. Write GENERALIZABLE, INSTRUCTIONAL guidance — a visual pattern that
     would help identify a grade/stage across DIFFERENT images of it,
     not a fact tied to one specific example image. Do NOT lift text
     from a single miss example verbatim — extract the underlying visual
     principle instead.
  3. Do NOT add a "Common Grades/Conditions to Know" style reference
     list.
  4. Keep the same overall structure (`# Produce Quality Grading —
     Lessons Learned`, `## What Worked` / `## What Didn't Work`) unless
     it genuinely has nothing useful to say.
  5. Keep it concrete and skimmable — short bullets, not paragraphs.
  6. PROTECT what's already working — before editing a bullet that
     plausibly helped produce one of the correct cases shown above,
     check whether your change would still support that case; prefer
     ADDING a new, narrowly-scoped distinction over REWRITING existing
     wording.
  7. VOCABULARY DISCIPLINE — this document is read across MANY datasets
     that each use their own label scheme (generic ripeness/condition
     terms like Ripe/Unripe/Dried/Damaged/Old on some datasets; a grade
     scale like grade-1/grade-2/grade-3, AA/AAA/Grade A, or a task-
     specific label like Keep/Cut on others). A real, confirmed failure
     mode: the model answers with a ripeness/condition word (e.g.
     "Dried") on a dataset whose actual classes are a grade scale,
     producing an unparseable, always-wrong answer — not a close miss,
     a total vocabulary mismatch. Every bullet or indicator you write
     must be framed as "this VISUAL pattern indicates X" where X maps
     onto whichever label scheme the image's OWN question is actually
     asking for, never stated as a bare ripeness/condition word as if
     that vocabulary applies universally. If `## Grade-Specific Logic`
     (or an equivalent section) already documents a non-ripeness scale,
     strengthen/expand it rather than letting the ripeness vocabulary
     above it read as the default — a reader skimming top-to-bottom
     should reach the dataset-specific scale before defaulting to a
     generic ripeness word.

  Respond with the full revised document (Markdown), starting with the
  `# Produce Quality Grading — Lessons Learned` heading, no preamble —
  then, on a new line by itself, write exactly:
  ---CHANGELOG---
  followed by a short bullet list (3-8 bullets) of the SPECIFIC changes
  you made and WHY, referencing the score or mistake that motivated each
  one. Do not skip this section.

