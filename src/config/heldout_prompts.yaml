  In 2-4 sentences, confirm and articulate the specific visual evidence
  (visible in THIS image) that correctly supports this species
  identification. IMPORTANT: if the model's own stated reasoning actually
  cited the WRONG evidence or reasoned unsoundly despite landing on the
  correct final answer (a lucky guess, not real identification skill),
  say so explicitly instead of crediting reasoning that wasn't actually
  sound.

  Respond with ONLY the explanation text — no headers, no restating the
  question.

# Params: {category} {trace_type_label} {n} {explanations_block} — category is "plant" or "weed" here.
heldout_species_map_summarize_prompt: |
  Below are {n} short explanations written about {trace_type_label} when
  a vision-language model identified "{category}" species in images.
  Each explanation describes ONE specific image's visual evidence.

  {explanations_block}

  Summarize the RECURRING, GENERALIZABLE patterns across these
