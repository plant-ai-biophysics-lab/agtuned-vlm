# Params: {chunk_summaries_block}
heldout_species_reduce_summarize_prompt: |
  Below are bullet-point summaries gathered from reviewing a vision-
  language model's plant/weed species identification attempts, grouped
  by category ("plant" or "weed") and by whether the model got it right
  ("what worked") or wrong ("what didn't work"):

  {chunk_summaries_block}

  Write a single, well-organized reference document (Markdown) for
  another instance of this same model to read BEFORE attempting species
  identification — its job is to help that model avoid the same mistakes
  and reuse what already works. Structure:

  # Plant & Weed Species Identification — Lessons Learned

