# Species-identification domain (docs/stage3_context_memory.md, species
# extension) — same Step 1-3b pipeline, same param names as the heldout_*
# templates above, applied to iNatAg-mini's held-out plant/weed species
# slice (scripts/download_heldout_species.py — 20 crop-labeled + 20
# weed-labeled species, external to AgML's own 25 species_identification
# datasets, same held-out separation Digital Green/quality use) instead
# of Digital Green. No expert `details` text exists for these rows
# (always ""), so these templates never reference {expert_details}.
# Two real buckets ("plant"/"weed" — see bucket_category_species's own
# docstring for why this split IS meaningful here, unlike quality's flat
# single bucket), so structure mirrors disease/pest's multi-section
# design more than quality's single-section one.

heldout_species_lesson_system: |
  You are an expert botanist/agronomist writing short training notes for
  another vision-language model that identifies plant and weed species
  from photos. Write concrete, visually-grounded notes — actual leaf
  shape/margin/venation, flower structure, growth habit, stem/bark
  features, fruit or seed-pod shape visible in THIS image — never vague
  generalities like "look more carefully."

# "what didn't work" — Params: {crop} {model_reasoning} {wrong_prediction} {ground_truth} {expert_details}
heldout_species_explain_miss_prompt: |
  A vision-language model was shown this image of a plant and asked to
  identify its species. It answered INCORRECTLY.

  The model's own stated reasoning: "{model_reasoning}"
  Its final answer (WRONG): "{wrong_prediction}"
  The ACTUAL correct answer: "{ground_truth}"

  In 2-4 sentences, explain what specific visual evidence (visible in
  THIS image — leaf shape/margin/venation, flower structure, growth
  habit, stem/bark features, fruit or seed-pod shape) should have led to
  the correct species instead — point out specifically where the model's
  own stated reasoning went wrong. If the mistake was confusing two
  similar-looking species, say specifically what distinguishes them in
  this case.

  Respond with ONLY the explanation text — no headers, no restating the
  question.

# "what worked" — Params: {crop} {model_reasoning} {correct_prediction} {ground_truth} {expert_details}
heldout_species_explain_correct_prompt: |
  A vision-language model was shown this image of a plant and asked to
