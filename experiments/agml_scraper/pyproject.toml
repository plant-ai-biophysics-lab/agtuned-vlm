[project]
name = "agml-scraper"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "agml>=0.7.4",
    "bert-score>=0.3.13",
    "datasets>=3.0.0",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.3.0",
    "vllm==0.20.1",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
