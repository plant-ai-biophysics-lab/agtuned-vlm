requires-python = ">=3.12,<3.14"
dependencies = [
    "agml>=0.7.4",
    "beautifulsoup4>=4.12",
    "bert-score>=0.3.13",
    "lxml>=4.9",
    "nltk>=3.8",
    "requests>=2.31",
    "streamlit>=1.35",
    "datasets>=3.0.0",
    "sentence-transformers>=3.0.0",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.3.0",
    "vllm==0.20.1; sys_platform == 'linux'",
]
