[project]
name = "h3-alignment"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "accelerate>=0.26.0",
    "agml>=0.7.4",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "scipy>=1.11.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=5.5.0",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
