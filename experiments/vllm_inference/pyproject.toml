[project]
name = "vllm-inference"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "agml>=0.7.4",
    "bitsandbytes>=0.49.2",
    "evaluate>=0.4.0",
    "pillow>=10.0.0",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.3.0",
    "vllm==0.20.1",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
